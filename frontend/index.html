
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VaultX — Your private vault</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-shell">
    <aside class="sidebar" id="sidebar">
        <div class="brand">
            <div class="brand-icon">V</div>
            <span>Vault<span class="brand-accent">X</span></span>
        </div>

        <button class="vault-switcher" id="vaultSwitcher">
            <span class="vault-avatar">P</span>
            <span class="vault-info">
                <strong>Personal Vault</strong>
                <small>Local vault</small>
            </span>
            <span class="switch-arrow">⌄</span>
        </button>

        <div class="nav-label">VAULT</div>
        <nav class="navigation">
            <button class="nav-item active" data-page="all">
                <span>▦</span> All items <span class="nav-count" id="allCount">0</span>
            </button>
            <button class="nav-item" data-page="favorites">
                <span>☆</span> Favorites
            </button>
            <button class="nav-item" data-page="recent">
                <span>◷</span> Recently added
            </button>
            <button class="nav-item" data-page="trash">
                <span>▤</span> Trash
            </button>
        </nav>

        <div class="nav-label">CATEGORIES</div>
        <nav class="navigation">
            <button class="nav-item" data-category="Login"><span>🔑</span> Logins</button>
            <button class="nav-item" data-category="Secure Note"><span>▤</span> Secure notes</button>
            <button class="nav-item" data-category="Card"><span>▣</span> Payment cards</button>
            <button class="nav-item" data-category="Identity"><span>♙</span> Identities</button>
            <button class="nav-item" data-category="API Key"><span>⌘</span> API credentials</button>
            <button class="nav-item" data-category="Wi-Fi"><span>◉</span> Wi-Fi networks</button>
        </nav>

        <div class="nav-label">TOOLS</div>
        <nav class="navigation">
            <button class="nav-item" data-page="generator"><span>⚄</span> Password generator</button>
            <button class="nav-item" data-page="security"><span>◈</span> Security center</button>
        </nav>

        <div class="sidebar-bottom">
            <button class="nav-item" data-page="settings"><span>⚙</span> Settings</button>
            <div class="sidebar-status">
                <span class="status-dot"></span>
                Demo mode · Not connected
            </div>
        </div>
    </aside>

    <main class="main-area">
        <header class="topbar">
            <button class="mobile-menu" id="mobileMenu">☰</button>
            <div class="breadcrumb">Personal Vault <span>/</span> <strong id="breadcrumb">All items</strong></div>
            <div class="top-actions">
                <div class="search-wrap">
                    <span>⌕</span>
                    <input id="searchInput" type="search" placeholder="Search your vault...">
                    <kbd>⌘ K</kbd>
                </div>
                <button class="icon-button" id="lockButton" title="Lock vault">♙</button>
                <button class="avatar-button" title="Profile">U</button>
            </div>
        </header>

        <section class="content">
            <div class="page-heading">
                <div>
                    <div class="eyebrow" id="pageEyebrow">YOUR PERSONAL SPACE</div>
                    <h1 id="pageTitle">All items</h1>
                    <p id="pageDescription">Everything important, protected in one place.</p>
                </div>
                <button class="primary-button" id="newItemButton">＋ New item</button>
            </div>

            <div id="pageContent"></div>
        </section>
    </main>
</div>

<!-- Add / Edit item modal -->
<div class="modal-backdrop hidden" id="itemModal">
    <div class="modal">
        <div class="modal-header">
            <div>
                <div class="eyebrow">YOUR VAULT</div>
                <h2 id="modalTitle">New item</h2>
            </div>
            <button class="close-button" data-close="itemModal">×</button>
        </div>

        <form id="itemForm">
            <input type="hidden" id="itemId">

            <label>Record type</label>
            <select id="itemType">
                <option>Login</option>
                <option>Secure Note</option>
                <option>Card</option>
                <option>Identity</option>
                <option>API Key</option>
                <option>Wi-Fi</option>
            </select>

            <label>Title</label>
            <input id="itemTitle" required maxlength="80" placeholder="e.g. GitHub">

            <div id="loginFields">
                <label>Username / Email</label>
                <input id="itemUsername" maxlength="150" placeholder="you@example.com">

                <label>Password</label>
                <div class="input-with-action">
                    <input id="itemPassword" type="password" maxlength="256" placeholder="Enter password">
                    <button type="button" class="inline-button" id="togglePassword">Show</button>
                    <button type="button" class="inline-button" id="generateInForm">Generate</button>
                </div>

                <label>Website URL</label>
                <input id="itemUrl" type="url" maxlength="500" placeholder="https://example.com">
            </div>

            <label>Folder</label>
            <select id="itemFolder">
                <option>Personal</option>
                <option>Work</option>
                <option>Finance</option>
                <option>Social</option>
            </select>

            <label>Notes</label>
            <textarea id="itemNotes" rows="3" maxlength="2000" placeholder="Additional information..."></textarea>

            <div class="modal-actions">
                <button type="button" class="secondary-button" data-close="itemModal">Cancel</button>
                <button type="submit" class="primary-button">Save item</button>
            </div>
        </form>
    </div>
</div>

<!-- Password generator modal -->
<div class="modal-backdrop hidden" id="generatorModal">
    <div class="modal">
        <div class="modal-header">
            <div>
                <div class="eyebrow">PASSWORD TOOLS</div>
                <h2>Password generator</h2>
            </div>
            <button class="close-button" data-close="generatorModal">×</button>
        </div>

        <div class="generated-password" id="generatedPassword">Click Generate</div>
        <div class="generator-actions">
            <button class="secondary-button" id="copyGenerated">Copy</button>
            <button class="primary-button" id="regenerate">↻ Generate</button>
        </div>

        <label>Length: <strong id="lengthValue">20</strong></label>
        <input type="range" id="passwordLength" min="8" max="64" value="20">

        <div class="checkbox-grid">
            <label><input type="checkbox" id="includeUpper" checked> Uppercase letters</label>
            <label><input type="checkbox" id="includeLower" checked> Lowercase letters</label>
            <label><input type="checkbox" id="includeNumbers" checked> Numbers</label>
            <label><input type="checkbox" id="includeSymbols" checked> Symbols</label>
        </div>
    </div>
</div>

<!-- Item details modal -->
<div class="modal-backdrop hidden" id="detailsModal">
    <div class="modal">
        <div class="modal-header">
            <div>
                <div class="eyebrow">RECORD DETAILS</div>
                <h2 id="detailsTitle">Item</h2>
            </div>
            <button class="close-button" data-close="detailsModal">×</button>
        </div>
        <div id="detailsContent"></div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script src="js/app.js"></script>
</body>
</html>
